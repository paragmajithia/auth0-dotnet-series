<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 630" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">DocShare architecture</title>
  <desc id="d">The browser talks to DocShare.Web. DocShare.Web sends the user to Auth0 to log in and gets a JWT back. DocShare.Web calls DocShare.Api with the JWT. DocShare.Api checks the token with Auth0's public keys and answers 200, 401 or 403.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="560" height="630" rx="16" fill="#f1f5f9"/>

  <!-- Boxes -->
  <rect x="20" y="30" width="130" height="100" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
  <text x="85" y="62" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Browser</text>
  <text x="85" y="86" font-size="13" fill="#475569" text-anchor="middle">Alice, Vibha, Carol</text>
  <text x="85" y="106" font-size="13" fill="#475569" text-anchor="middle">(fake users)</text>

  <rect x="205" y="30" width="150" height="100" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="280" y="62" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">DocShare.Web</text>
  <text x="280" y="86" font-size="13" fill="#475569" text-anchor="middle">https://localhost:7001</text>
  <text x="280" y="106" font-size="13" fill="#475569" text-anchor="middle">keeps secret + tokens</text>

  <rect x="410" y="30" width="130" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="475" y="62" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Auth0</text>
  <text x="475" y="86" font-size="13" fill="#475569" text-anchor="middle">login + roles</text>
  <text x="475" y="106" font-size="13" fill="#475569" text-anchor="middle">issues the JWT</text>

  <rect x="195" y="300" width="170" height="100" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
  <text x="280" y="332" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">DocShare.Api</text>
  <text x="280" y="356" font-size="13" fill="#475569" text-anchor="middle">https://localhost:7002</text>
  <text x="280" y="376" font-size="13" fill="#475569" text-anchor="middle">checks JWT + permissions</text>

  <!-- Arrows -->
  <line x1="150" y1="80" x2="205" y2="80" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="355" y1="60" x2="410" y2="60" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="410" y1="100" x2="355" y2="100" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="250" y1="130" x2="250" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="365" y1="335" x2="462" y2="134" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <line x1="310" y1="300" x2="310" y2="130" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step badges on arrows -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="178" cy="80" r="12" fill="#0f172a"/><text x="178" y="85">1</text>
    <circle cx="382" cy="60" r="12" fill="#0f172a"/><text x="382" y="65">2</text>
    <circle cx="382" cy="100" r="12" fill="#0f172a"/><text x="382" y="105">3</text>
    <circle cx="250" cy="215" r="12" fill="#0f172a"/><text x="250" y="220">4</text>
    <circle cx="413" cy="235" r="12" fill="#0f172a"/><text x="413" y="240">5</text>
    <circle cx="310" cy="215" r="12" fill="#0f172a"/><text x="310" y="220">6</text>
  </g>

  <!-- Legend -->
  <text x="20" y="440" font-size="16" font-weight="700" fill="#0f172a">What happens</text>
  <g font-size="15" fill="#0f172a">
    <circle cx="32" cy="468" r="11" fill="#0f172a"/><text x="32" y="473" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="54" y="473">You open the app and click Login</text>
    <circle cx="32" cy="498" r="11" fill="#0f172a"/><text x="32" y="503" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="54" y="503">The web app sends you to Auth0 to sign in</text>
    <circle cx="32" cy="528" r="11" fill="#0f172a"/><text x="32" y="533" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="54" y="533">Auth0 returns a code, swapped for a JWT access token</text>
    <circle cx="32" cy="558" r="11" fill="#0f172a"/><text x="32" y="563" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="54" y="563">The web app calls the API with the token as Bearer</text>
    <circle cx="32" cy="588" r="11" fill="#0f172a"/><text x="32" y="593" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="54" y="593">The API checks the signature with Auth0's public keys</text>
    <circle cx="32" cy="618" r="11" fill="#0f172a"/><text x="32" y="623" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="54" y="623">The API answers 200, 401 or 403</text>
  </g>
</svg>
